# Timeline configuration
timeline:
  role-assignment-at: 20        # Rôles distribués à 20 minutes
  pvp-activation-at: 45         # PVP activé à 45 minutes
  episode-length: 20            # Durée d'un épisode (20 min)
  usurp-window-start-min: 20    # Début de la fenêtre d'usurpation du Doppelganger (min)
  usurp-window-end-min: 60      # Fin de la fenêtre d'usurpation du Doppelganger (min)

# Composition configuration
# Chaque rôle est UNIQUE (0 ou 1) sauf VAMPIRE_MINION (les Sbires, plusieurs possibles).
# 'joueurs' doit être égal à la somme de tous les rôles : le lancement exige ce nombre exact.
compo:
  joueurs: 25                   # Nombre de joueurs requis pour /vuhc start (= somme des rôles)
  vampires:                     # Nombre de joueurs par rôle vampire
    MASTER: 1                   # Le Maître (unique)
    COMTE: 1                    # Le Comte (unique)
    VAMPIRE_MINION: 4           # Les Sbires (seul rôle répétable)
  villageois:                   # 16 rôles, un de chaque
    PALADIN: 1
    CUPIDON: 1
    SAVIOR: 1
    SOUL_WEIGHTER: 1
    WEAVER: 1
    CARTOGRAPHER: 1
    SAND_MERCHANT: 1
    GRAVE_DIGGER: 1
    WHITE_LADY: 1
    BABA_YAGA: 1
    BANSHEE: 1
    WATCHMAN: 1
    EXORCIST: 1
    ARCHER: 1
    BOURREAU: 1
    PRIEST: 1
  solitaires:                   # 3 rôles, un de chaque
    APPRENTICE_SLAYER: 1
    GREMLIN: 1
    DOPPELGANGER: 1
  vote-every-minutes: 10        # Les vampires votent pour une marque toutes les X minutes

# Map configuration
map:
  size: 1000                    # Taille de la map (carré, centrée sur 0;0)
  seed: 0                       # Seed de génération (0 = seed aléatoire du serveur)
  dark-forest-radius: 400       # Rayon de la forêt sombre garantie autour de 0;0
  spawn-radius: 350             # Rayon du disque dans lequel les joueurs sont éparpillés au début
  min-spawn-distance: 25        # Distance minimale entre deux joueurs au début de la partie
  pregen-chunks-per-tick: 8     # Chunks demandés par tick pendant la pré-génération du disque d'éparpillement (lancée au /vuhc start)
  ores:                         # Filons de minerais par chunk (gros filons, peu éparpillés)
    coal-per-chunk: 2           #   Charbon (Y <= 80, filons de 12-20)
    iron-per-chunk: 2           #   Fer (Y <= 60, filons de 8-15)
    gold-per-chunk: 1           #   Or (Y <= 32, filons de 5-8)
    redstone-per-chunk: 1       #   Redstone (Y <= 16, filons de 6-10)
    diamond-per-chunk: 1        #   Diamant (Y <= 16, filons de 3-6)

# Gameplay configuration
gameplay:
  auto-smelt: true              # Fonte automatique des minerais (fer, or, débris antiques...)
  better-loot: true             # Meilleurs loots (plus d'or, de cuir, de pommes)
  apple-drop-chance: 0.05       # Chance qu'une feuille casse donne une pomme
  leather-bonus: 2              # Nombre de cuirs bonus par vache tuée

# Game lifecycle configuration
game:
  countdown-seconds: 30         # Durée du compte à rebours de /vuhc start (secondes)
  disconnect-grace-minutes: 10  # Temps de grâce avant élimination après une déconnexion
  starting-kit: true            # Kit de départ (pioche/hache/épée en pierre + nourriture)

# UHC rules configuration
rules:
  no-natural-regen: true        # Pas de régénération naturelle de vie
  beds-blocked: true            # Les lits sont interdits
  nether-end-blocked: true      # Nether et End désactivés

# Vampire configuration
vampires:
  day-weakness: true            # Faiblesse des vampires le jour (désactivable)
  marks-to-remove-weakness: 2   # A partir de X joueurs marqués, perte de la faiblesse
  marks-for-night-strength: 4   # A partir de nX joueurs marqués, force la nuit
  master:
    starting-hearts: 8          # Coeurs initiaux du Maître Vampire
    marks-to-infect: 3          # Nombre de marques nécessaires pour infecter un joueur

# Marker configuration
markers:
  cupidon:
    notify-delay-min-seconds: 0      # Délai minimum avant notification Cupidon (secondes)
    notify-delay-max-seconds: 600    # Délai maximum avant notification Cupidon (secondes)
  amour-death:
    hearts-lost: 5                   # Coeurs perdus quand l'amour meurt
    duration-seconds: 600            # Durée du penalty (secondes)

# Messages configuration
messages:
  prefix: "&5&lVampireUHC &8» &r"   # Préfixe utilisé dans tous les messages

# Administrateurs autorisés à lancer, arrêter ou réinitialiser la partie
admins:
  players:
    - "Pseudo1"
    - "Pseudo2"

# Apprentie assassin configuration
solo:
  slayer:
    dark-threshold: 3          # Plus de X marqueurs obscurs --> force légère la nuit
    light-threshold: 3         # Plus de X marqueurs lumineux --> force légère le jour
    dark-high-threshold: 6     # Plus de nX marqueurs obscurs --> force + régénération la nuit
    light-high-threshold: 6    # Plus de nX marqueurs lumineux --> force + régénération le jour
